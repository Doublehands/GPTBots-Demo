<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Clickable Capabilities Layout</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #101412;
    color: #f7f8f5;
  }
  button {
    font: inherit;
  }
  .page {
    min-height: 100vh;
    padding: 28px;
    background:
      radial-gradient(circle at 12% 8%, rgba(117, 185, 138, .26), transparent 32%),
      linear-gradient(135deg, #0f1512 0%, #1f261f 48%, #0e1110 100%);
  }
  .intro {
    max-width: 1140px;
    margin: 0 auto 20px;
  }
  .eyebrow {
    margin: 0 0 8px;
    color: #bce8c4;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.08;
  }
  .intro p {
    max-width: 760px;
    margin: 0;
    color: rgba(247,248,245,.78);
    line-height: 1.55;
  }
  .mock {
    max-width: 1280px;
    margin: 0 auto;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 28px 80px rgba(0,0,0,.42);
    background: #151a17;
  }
  .stage {
    position: relative;
    min-height: min(76vh, 760px);
    isolation: isolate;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(90deg, rgba(8,12,10,.72) 0%, rgba(8,12,10,.28) 32%, rgba(8,12,10,.08) 62%, rgba(8,12,10,.46) 100%), url("/files/aurora-hotel-dialog-simulation.png");
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,15,12,.1), rgba(10,15,12,.54));
    z-index: -1;
  }
  .rail {
    position: absolute;
    left: clamp(18px, 4vw, 42px);
    top: 50%;
    transform: translateY(-50%);
    width: min(250px, 28vw);
    display: grid;
    gap: 12px;
  }
  .channel {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px;
    background: rgba(255,255,255,.88);
    color: #172018;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.18);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .channel:hover {
    transform: translateX(4px);
  }
  .channel:focus-visible {
    outline: 3px solid rgba(131, 230, 146, .85);
    outline-offset: 3px;
  }
  .channel.is-active {
    border-color: rgba(89, 188, 105, .85);
    box-shadow: 0 0 0 3px rgba(89,188,105,.25), 0 16px 30px rgba(0,0,0,.26);
  }
  .icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #31a967;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
  }
  .channel:nth-child(2) .icon { background: #249ec1; }
  .channel:nth-child(3) .icon { background: #36b66f; }
  .channel:nth-child(4) .icon { background: #30b860; }
  .channel:nth-child(5) .icon { background: #ed8f27; }
  .channel:nth-child(6) .icon { background: #6656d9; }
  .label strong {
    display: block;
    font-size: 18px;
  }
  .label span {
    display: block;
    margin-top: 2px;
    color: rgba(23,32,24,.7);
    font-size: 12px;
  }
  .panel {
    position: absolute;
    right: clamp(22px, 5vw, 58px);
    bottom: clamp(22px, 5vw, 52px);
    width: min(430px, 36vw);
    padding: 22px;
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 16px;
    background: rgba(15, 24, 18, .78);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 26px 60px rgba(0,0,0,.35);
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 24px;
  }
  .panel p {
    margin: 0 0 16px;
    color: rgba(247,248,245,.8);
    line-height: 1.52;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .chips span {
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    font-size: 12px;
    color: #e9f7e8;
  }
  .message {
    border-radius: 12px;
    background: rgba(255,255,255,.92);
    color: #192018;
    padding: 14px;
    font-size: 14px;
    line-height: 1.45;
  }
  .hint {
    max-width: 1280px;
    margin: 14px auto 0;
    color: rgba(247,248,245,.68);
    font-size: 14px;
  }
  @media (max-width: 860px) {
    .page { padding: 18px; }
    .stage { min-height: 760px; }
    .rail {
      left: 16px;
      right: 16px;
      top: 18px;
      transform: none;
      width: auto;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .channel {
      grid-template-columns: 34px 1fr;
      min-height: 54px;
      padding: 8px 10px;
    }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 11px;
    }
    .label strong { font-size: 15px; }
    .panel {
      left: 16px;
      right: 16px;
      bottom: 18px;
      width: auto;
    }
  }
</style>
</head>
<body>
<main class="page">
  <section class="intro">
    <p class="eyebrow">Clickable mockup</p>
    <h1>这版左侧按钮可以点击切换</h1>
    <p>请点击 App Push、WebPush、SMS、WhatsApp、Email、MA Journey，右侧浮层会切换对应触达场景。</p>
  </section>
  <section class="mock">
    <div class="stage">
      <div class="rail" role="tablist" aria-label="EngageLab channels">
        <button type="button" class="channel is-active" data-channel="app" role="tab" aria-selected="true">
          <span class="icon">APP</span><span class="label"><strong>APP Push</strong><span>In-App Messages</span></span>
        </button>
        <button type="button" class="channel" data-channel="webpush" role="tab" aria-selected="false">
          <span class="icon">WEB</span><span class="label"><strong>WebPush</strong><span>Browser Notifications</span></span>
        </button>
        <button type="button" class="channel" data-channel="sms" role="tab" aria-selected="false">
          <span class="icon">SMS</span><span class="label"><strong>SMS</strong><span>Text Messages</span></span>
        </button>
        <button type="button" class="channel" data-channel="whatsapp" role="tab" aria-selected="false">
          <span class="icon">WA</span><span class="label"><strong>WhatsApp</strong><span>Messaging</span></span>
        </button>
        <button type="button" class="channel" data-channel="email" role="tab" aria-selected="false">
          <span class="icon">MAIL</span><span class="label"><strong>Email</strong><span>Email Campaigns</span></span>
        </button>
        <button type="button" class="channel" data-channel="ma" role="tab" aria-selected="false">
          <span class="icon">MA</span><span class="label"><strong>MA Journey</strong><span>Automation Flow</span></span>
        </button>
      </div>
      <aside class="panel" role="tabpanel" aria-live="polite">
        <h2 id="panel-title">APP Push · 行前入住提醒</h2>
        <p id="panel-copy">EngageLab 根据预订状态触发行前提醒，GPTBots 承接回复和加购咨询，Livedesk 处理特殊要求。</p>
        <div class="chips" id="panel-tags">
          <span>到店前 24h</span><span>房型偏好</span><span>机场接送</span><span>会员权益</span>
        </div>
        <div class="message" id="panel-message">Aurora Hotel：明天 15:00 可办理入住。点击确认早餐偏好、机场接送和延迟退房权益。</div>
      </aside>
    </div>
  </section>
  <p class="hint">现在这个 mockup 已经是可点击版本。正式实现时会把同样的数据和交互写入页面 JS。</p>
</main>
<script>
  const DATA = {
    app: {
      title: "APP Push · 行前入住提醒",
      copy: "EngageLab 根据预订状态触发行前提醒，GPTBots 承接回复和加购咨询，Livedesk 处理特殊要求。",
      tags: ["到店前 24h", "房型偏好", "机场接送", "会员权益"],
      message: "Aurora Hotel：明天 15:00 可办理入住。点击确认早餐偏好、机场接送和延迟退房权益。"
    },
    webpush: {
      title: "WebPush · 官网未订召回",
      copy: "对官网浏览房型但未下单的访客，EngageLab 发起浏览器提醒，GPTBots 接住咨询并解释价格/政策。",
      tags: ["官网访客", "未完成预订", "房型召回", "价格提醒"],
      message: "您查看的海景房仍有可订时段。点击继续比较套餐，AI 助手可帮您确认取消政策。"
    },
    sms: {
      title: "SMS · 高到达率确认",
      copy: "短信用于关键节点确认，例如预订确认、入住时间、服务工单状态，适合需要稳定触达的场景。",
      tags: ["订单确认", "工单状态", "到店提醒", "高到达率"],
      message: "Aurora Hotel：您的服务单 HS-240815-018 已派单，预计 12 分钟内送达。"
    },
    whatsapp: {
      title: "WhatsApp · 海外宾客对话",
      copy: "海外宾客通过 WhatsApp 咨询机场接送、房型、特殊需求，GPTBots 先答复，复杂问题转 Livedesk。",
      tags: ["海外客群", "机场接送", "多语言", "人工接管"],
      message: "Yes, airport transfer can be arranged. Would you like me to add it to your booking?"
    },
    email: {
      title: "Email · 套餐资料与长内容",
      copy: "Email 用于发送会议宴会方案、套餐资料、会员权益说明等长内容，MA 记录打开和点击行为。",
      tags: ["宴会资料", "会员权益", "套餐报价", "点击回流"],
      message: "已发送 Aurora Hotel 会议宴会方案，内含厅型、餐饮、婚房与试菜安排。"
    },
    ma: {
      title: "MA Journey · 全旅程编排",
      copy: "MA 把预订、行前、到店、住中、离店复购串成自动旅程，并把行为标签回流给 GPTBots 和 Livedesk。",
      tags: ["用户旅程", "分群标签", "复购培育", "服务闭环"],
      message: "旅程已进入“离店复购”阶段：满意度问卷完成后，自动发送下次入住权益。"
    }
  };

  const titleEl = document.getElementById("panel-title");
  const copyEl = document.getElementById("panel-copy");
  const tagsEl = document.getElementById("panel-tags");
  const messageEl = document.getElementById("panel-message");
  document.querySelectorAll(".channel").forEach((button) => {
    button.addEventListener("click", () => {
      const key = button.dataset.channel;
      const item = DATA[key];
      if (!item) return;
      document.querySelectorAll(".channel").forEach((candidate) => {
        const active = candidate === button;
        candidate.classList.toggle("is-active", active);
        candidate.setAttribute("aria-selected", active ? "true" : "false");
      });
      titleEl.textContent = item.title;
      copyEl.textContent = item.copy;
      tagsEl.innerHTML = item.tags.map((tag) => `<span>${tag}</span>`).join("");
      messageEl.textContent = item.message;
    });
  });
</script>
</body>
</html>
